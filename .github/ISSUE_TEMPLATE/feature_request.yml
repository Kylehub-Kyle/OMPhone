name: 功能建议
description: 想要的新能力或交互改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 描述实际使用中卡住的地方，而不是直接给方案
      placeholder: "拍完视频后，相册里要等很久才出现封面…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 内容不含抓包文件、序列号、局域网 IP 或真实照片
          required: true
